services:
  postgres:
    image: postgres:16
    container_name: habit-tracker-db
    environment:
      POSTGRES_DB: habitdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Europe/Tallinn
      PGTZ: Europe/Tallinn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: