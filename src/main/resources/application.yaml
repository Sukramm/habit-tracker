spring:
  application:
    name: habit-tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/habitdb?currentSchema=public
    username: postgres
    password: secret
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Tallinn

server:
  port: 8080