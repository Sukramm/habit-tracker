spring:
  application:
    name: habit-tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/habitdb?currentSchema=public
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Tallinn

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000